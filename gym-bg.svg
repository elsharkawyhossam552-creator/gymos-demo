<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030814"/>
      <stop offset="0.55" stop-color="#0a1426"/>
      <stop offset="1" stop-color="#12305f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa6c3"/>
      <stop offset="1" stop-color="#4a5d78"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#1b2f4d" stroke-width="1" opacity="0.35">
    <path d="M0 120h1600M0 240h1600M0 360h1600M0 480h1600M0 600h1600M0 720h1600"/>
    <path d="M160 0v900M320 0v900M480 0v900M640 0v900M800 0v900M960 0v900M1120 0v900M1280 0v900M1440 0v900"/>
  </g>

  <!-- dumbbell silhouette left -->
  <g transform="translate(180,120) rotate(-18)" filter="url(#shadow)" opacity="0.9">
    <rect x="150" y="70" width="340" height="52" rx="26" fill="url(#steel)"/>
    <rect x="120" y="42" width="80" height="88" rx="16" fill="url(#steel)"/>
    <rect x="440" y="42" width="80" height="88" rx="16" fill="url(#steel)"/>
    <rect x="100" y="52" width="70" height="68" rx="12" fill="#5a6e8c"/>
    <rect x="470" y="52" width="70" height="68" rx="12" fill="#5a6e8c"/>
    <rect x="80" y="62" width="56" height="48" rx="10" fill="#3a4c66"/>
    <rect x="504" y="62" width="56" height="48" rx="10" fill="#3a4c66"/>
  </g>

  <!-- dumbbell right (larger, accent) -->
  <g transform="translate(980,620) rotate(14) scale(1.6)" filter="url(#shadow)" opacity="0.85">
    <rect x="150" y="62" width="300" height="46" rx="23" fill="url(#steel)"/>
    <rect x="122" y="38" width="70" height="78" rx="14" fill="url(#steel)"/>
    <rect x="408" y="38" width="70" height="78" rx="14" fill="url(#steel)"/>
    <rect x="104" y="46" width="60" height="60" rx="10" fill="#5a6e8c"/>
    <rect x="436" y="46" width="60" height="60" rx="10" fill="#5a6e8c"/>
  </g>

  <!-- barbell plates -->
  <g transform="translate(520,660)" filter="url(#shadow)" opacity="0.95">
    <rect x="240" y="64" width="360" height="40" rx="20" fill="url(#steel)"/>
    <rect x="200" y="44" width="66" height="80" rx="12" fill="#3a4c66"/>
    <rect x="574" y="44" width="66" height="80" rx="12" fill="#3a4c66"/>
    <rect x="168" y="52" width="50" height="64" rx="10" fill="#2a3a52"/>
    <rect x="622" y="52" width="50" height="64" rx="10" fill="#2a3a52"/>
    <rect x="140" y="60" width="38" height="48" rx="8" fill="#1c2a3f"/>
    <rect x="662" y="60" width="38" height="48" rx="8" fill="#1c2a3f"/>
  </g>

  <!-- kettlebell -->
  <g transform="translate(250,600)" filter="url(#shadow)" opacity="0.8">
    <ellipse cx="90" cy="52" rx="52" ry="44" fill="url(#steel)"/>
    <path d="M90 4c30 0 56 8 56 28 0 22-22 26-56 26S34 54 34 32c0-20 26-28 56-28z" fill="#5a6e8c"/>
    <rect x="82" y="38" width="16" height="30" rx="8" fill="#3a4c66"/>
  </g>

  <!-- floating accent dots -->
  <circle cx="120" cy="120" r="5" fill="#4da3ff" opacity="0.7"/>
  <circle cx="1480" cy="200" r="4" fill="#6ec1ff" opacity="0.6"/>
  <circle cx="320" cy="820" r="6" fill="#4da3ff" opacity="0.5"/>
  <circle cx="1250" cy="120" r="3" fill="#6ec1ff" opacity="0.7"/>

  <!-- bottom vignette -->
  <rect width="1600" height="280" y="620" fill="url(#g)" opacity="0.7"/>
</svg>